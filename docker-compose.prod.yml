# Production override: replaces `build:` with the images published to GHCR
# by .github/workflows/cd.yml, and wires the frontend + backend into an
# externally managed Traefik instance instead of publishing raw host ports.
# Used on the deploy host as:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# GHCR_REPO defaults to this repo's own package path; IMAGE_TAG defaults to
# `latest` (CD also tags every push with the commit SHA if you want to pin).
#
# Requires an external Docker network named `proxy` that Traefik itself is
# attached to (create once with `docker network create proxy` if it doesn't
# already exist from another project). See DEPLOYMENT.md.
networks:
  proxy:
    external: true

services:
  redis:
    ports: !reset []

  gateway:
    ports: !reset []

  backend:
    build: !reset null
    image: ${GHCR_REPO:-ghcr.io/md-huzaifa-islam/heckathon-frontend}/backend:${IMAGE_TAG:-latest}
    # No container_name here on purpose: a fixed name can only ever apply to
    # one container, which caps replicas at 1 and makes `docker compose up`
    # error out ("container name already in use") the moment BACKEND_REPLICAS
    # is raised above 1. Compose auto-names each replica instead
    # (<project>-backend-1, -2, -3, ...).
    ports: !reset []
    networks:
      - default
      - proxy
    # Traefik load-balances across every container matching this router's
    # service label automatically — no extra config needed to fan requests
    # out across replicas, just more containers registering under the same
    # service name. Correctness under concurrent holds relies on Postgres
    # row-level atomicity (see DECISIONS.md #2), not any in-process state,
    # so it's safe to run several backend replicas side by side.
    deploy:
      replicas: ${BACKEND_REPLICAS:-3}
    # No Docker healthcheck here: Next.js's standalone server (see the
    # frontend service below) binds to $HOSTNAME when Docker sets it
    # (which it always does, to the container's own ID), not 127.0.0.1 —
    # a loopback-based healthcheck fails immediately even though the app
    # is fine, and Traefik's Docker provider excludes unhealthy
    # containers from routing entirely, which silently broke this whole
    # router. Simplest fix: don't gate routing on a healthcheck.
    labels:
      - traefik.enable=true
      # Required because this container is on two networks (default +
      # proxy) — without it Traefik can't tell which one to route
      # through and silently fails to create the router.
      - traefik.docker.network=proxy
      - traefik.http.routers.${BACKEND_ROUTER_NAME:-cinemaseat-backend}.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.${BACKEND_ROUTER_NAME:-cinemaseat-backend}.entrypoints=websecure
      - traefik.http.routers.${BACKEND_ROUTER_NAME:-cinemaseat-backend}.tls=true
      - traefik.http.routers.${BACKEND_ROUTER_NAME:-cinemaseat-backend}.tls.certresolver=letsencrypt
      - traefik.http.services.${BACKEND_SERVICE_NAME:-cinemaseat-backend}.loadbalancer.server.port=4000

  frontend:
    build: !reset null
    image: ${GHCR_REPO:-ghcr.io/md-huzaifa-islam/heckathon-frontend}/frontend:${IMAGE_TAG:-latest}
    container_name: ${FRONTEND_CONTAINER_NAME:-cinemaseat-frontend}
    ports: !reset []
    environment:
      # Next.js's standalone server.js binds to $HOSTNAME when it's set,
      # and Docker always sets it to the container's own hex ID — which
      # only resolves on the `default` network, not `proxy` (the one
      # Traefik actually routes through), so Traefik got connection
      # refused (502) despite the container being perfectly healthy.
      # Forcing 0.0.0.0 makes it listen on every interface.
      HOSTNAME: "0.0.0.0"
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      # Required because this container is on two networks (default +
      # proxy) — without it Traefik can't tell which one to route
      # through and silently fails to create the router.
      - traefik.docker.network=proxy
      - traefik.http.routers.${FRONTEND_ROUTER_NAME:-cinemaseat-frontend}.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.${FRONTEND_ROUTER_NAME:-cinemaseat-frontend}.entrypoints=websecure
      - traefik.http.routers.${FRONTEND_ROUTER_NAME:-cinemaseat-frontend}.tls=true
      - traefik.http.routers.${FRONTEND_ROUTER_NAME:-cinemaseat-frontend}.tls.certresolver=letsencrypt
      - traefik.http.services.${FRONTEND_SERVICE_NAME:-cinemaseat-frontend}.loadbalancer.server.port=3000
