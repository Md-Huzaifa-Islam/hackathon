services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    image: asifmahmoud414/mock-gateway:latest
    restart: unless-stopped
    ports:
      - "9000:9000"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      # External DB (Supabase, Neon, RDS, etc.) — no in-compose postgres.
      # Set DATABASE_URL in .env for real use; empty here only so a bare
      # `docker compose up` doesn't hard-fail before you've read the README
      # — the backend itself will refuse to boot without it (config/env.ts).
      # For a zero-config local run, layer docker-compose.local.yml instead,
      # which supplies a disposable in-compose Postgres.
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: redis://redis:6379
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-60}
      GATEWAY_URL: http://gateway:9000
      CALLBACK_BASE_URL: http://backend:4000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-in-production}
    depends_on:
      redis:
        condition: service_healthy
      gateway:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    depends_on:
      - backend
