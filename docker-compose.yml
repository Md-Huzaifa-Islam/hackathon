services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    image: asifmahmoud414/mock-gateway:latest
    restart: unless-stopped
    ports:
      - "9000:9000"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      # External DB (Supabase, Neon, RDS, etc.) — no in-compose postgres.
      # Set DATABASE_URL in .env for real use; empty here only so a bare
      # `docker compose up` doesn't hard-fail before you've read the README
      # — the backend itself will refuse to boot without it (config/env.ts).
      # For a zero-config local run, layer docker-compose.local.yml instead,
      # which supplies a disposable in-compose Postgres.
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: redis://redis:6379
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-180}
      PAYMENT_WINDOW_SECONDS: ${PAYMENT_WINDOW_SECONDS:-900}
      GATEWAY_URL: http://gateway:9000
      CALLBACK_BASE_URL: http://backend:4000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-in-production}
      # Must match the mock gateway's own GATEWAY_SECRET (its default is
      # z2p-2026-secret, same as our fallback) — used to verify the
      # X-Signature header on /payments/callback.
      GATEWAY_SECRET: ${GATEWAY_SECRET:-z2p-2026-secret}
      # better-auth's allowed origins for the browser session cookie — the
      # frontend's own URL, not NEXT_PUBLIC_API_BASE_URL (which is the
      # backend's URL). Comma-separated if you need more than one.
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000}
      # Stripe is the real payment provider (mock gateway is OTP-only) — see
      # .env.example for where to get these.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-usd}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      redis:
        condition: service_healthy
      gateway:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    depends_on:
      - backend
